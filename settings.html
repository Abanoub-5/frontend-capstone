<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="LeadRadar AI - manage your profile, account security, and notification preferences."
    />
    <meta name="theme-color" content="#2563eb" />
    <title>Settings - LeadRadar AI</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>"
    />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="header">
      <h1>Settings</h1>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="settings.html" class="nav-link active" aria-current="page"
          >Settings</a
        >
      </nav>
    </header>

    <main class="main" id="main-content">
      <section class="settings-section" aria-labelledby="profile-heading">
        <h2 id="profile-heading">Profile Information</h2>
        <form id="profile-form" class="profile-form" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              minlength="3"
              maxlength="20"
              pattern="[a-zA-Z0-9_]+"
              aria-describedby="username-error"
            />
            <span class="error-message" id="username-error"></span>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              aria-describedby="email-error"
            />
            <span class="error-message" id="email-error"></span>
          </div>

          <div class="form-group">
            <label for="display-name">Display Name</label>
            <input
              type="text"
              id="display-name"
              name="displayName"
              maxlength="50"
              aria-describedby="display-name-error"
            />
            <span class="error-message" id="display-name-error"></span>
          </div>

          <div class="form-group">
            <label for="bio">Bio</label>
            <textarea
              id="bio"
              name="bio"
              rows="4"
              maxlength="200"
              aria-describedby="bio-error bio-count"
            ></textarea>
            <span class="char-count" id="bio-count">0/200</span>
            <span class="error-message" id="bio-error"></span>
          </div>

          <div class="form-group">
            <label for="avatar">Avatar URL</label>
            <input
              type="url"
              id="avatar"
              name="avatar"
              placeholder="https://example.com/avatar.png"
              aria-describedby="avatar-error"
            />
            <span class="error-message" id="avatar-error"></span>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn btn-secondary" id="reset-btn">
              Reset
            </button>
          </div>
        </form>
      </section>

      <section class="settings-section" aria-labelledby="account-heading">
        <h2 id="account-heading">Account Settings</h2>
        <form id="account-form" class="account-form" novalidate>
          <div class="form-group">
            <label for="current-password">Current Password</label>
            <input
              type="password"
              id="current-password"
              name="currentPassword"
              autocomplete="current-password"
              aria-describedby="current-password-error"
            />
            <span class="error-message" id="current-password-error"></span>
          </div>

          <div class="form-group">
            <label for="new-password">New Password</label>
            <input
              type="password"
              id="new-password"
              name="newPassword"
              minlength="8"
              pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}"
              autocomplete="new-password"
              aria-describedby="new-password-error new-password-hint"
            />
            <span class="error-message" id="new-password-error"></span>
            <p class="hint" id="new-password-hint">
              Minimum 8 characters, at least one uppercase, lowercase, and
              number
            </p>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm New Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirmPassword"
              autocomplete="new-password"
              aria-describedby="confirm-password-error"
            />
            <span class="error-message" id="confirm-password-error"></span>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              Update Password
            </button>
          </div>
        </form>
      </section>

      <section class="settings-section" aria-labelledby="notifications-heading">
        <h2 id="notifications-heading">Notifications</h2>
        <form id="notifications-form" class="notifications-form">
          <div class="toggle-group">
            <label class="toggle-label">
              <span>Email Notifications</span>
              <input
                type="checkbox"
                id="email-notifications"
                name="emailNotifications"
                checked
              />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="toggle-group">
            <label class="toggle-label">
              <span>Push Notifications</span>
              <input
                type="checkbox"
                id="push-notifications"
                name="pushNotifications"
                checked
              />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="toggle-group">
            <label class="toggle-label">
              <span>Weekly Digest</span>
              <input type="checkbox" id="weekly-digest" name="weeklyDigest" />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              Save Preferences
            </button>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 LeadRadar AI. Built with AI-assisted development.</p>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="settings.js"></script>
  </body>
</html>
